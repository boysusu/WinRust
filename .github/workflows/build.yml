# Builds and tests pushes to main and pull requests. Only pushes to main retain the installer artifact.
# Version tags (v*) are published by release.yml instead, as WinRust.exe.
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Build all (plugins, payload, installer)
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
      - name: Test workspace
        run: cargo test --workspace
      - name: Test rust-search
        run: cargo test
        working-directory: plugins/rust-search
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: WinRust
          path: target/release/plugin-launcher.exe
